name: Security Scan

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run npm audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: false

      - name: Run Dependabot
        uses: dependabot/dependabot-action@latest
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue on vulnerability found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');

            // Get security scan output
            const auditResult = execSync('pnpm audit --json', { encoding: 'utf-8' });
            const vulnerabilities = JSON.parse(auditResult.stdout);

            // Check for critical or high severity
            const criticalVulns = vulnerabilities.vulnerabilities.filter(v => 
              v.severity === 'critical' || v.severity === 'high'
            );

            if (criticalVulns.length > 0) {
              console.log('Found critical/high vulnerabilities!');
              
              // Create GitHub issue
              execSync(`gh issue create --title "🔒 Security: Critical vulnerabilities found" --body "Security scan found ${criticalVulns.length} critical/high severity vulnerabilities.\\n\\nPlease review and fix before merging.\\n\\nRun \`pnpm audit\` locally for details." --label security --assignee @irfandi`, { stdio: 'inherit' });
            }
        github-token: ${{ secrets.GITHUB_TOKEN }}
