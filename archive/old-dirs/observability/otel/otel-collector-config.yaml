receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:3000"
            - "http://localhost:5173"
            - "https://*.finance-manager.com"
          allowed_headers:
            - "*"

  prometheus:
    config:
      scrape_configs:
        - job_name: "otel-collector"
          scrape_interval: 10s
          static_configs:
            - targets: ["0.0.0.0:8888"]

        - job_name: "finance-manager-backend"
          scrape_interval: 15s
          static_configs:
            - targets: ["backend:8080"]
          metrics_path: "/metrics"

        - job_name: "nginx"
          scrape_interval: 15s
          static_configs:
            - targets: ["nginx:9113"]
          metrics_path: "/metrics"

        - job_name: "redis"
          scrape_interval: 15s
          static_configs:
            - targets: ["redis:6379"]

        - job_name: "postgres"
          scrape_interval: 15s
          static_configs:
            - targets: ["postgres:5432"]

  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_http:
        endpoint: 0.0.0.0:14268

  zipkin:
    endpoint: 0.0.0.0:9411

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  memory_limiter:
    limit_mib: 512
    spike_limit_mib: 128
    check_interval: 5s

  resource:
    attributes:
      - key: service.namespace
        value: finance-manager
        action: upsert
      - key: deployment.environment
        from_attribute: environment
        action: upsert

  attributes:
    actions:
      - key: http.user_agent
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: sensitive_data
        action: delete

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s&compress=lz4
    database: signoz_traces
    username: signoz
    password: signoz
    ttl_days: 7
    logs_table_name: signoz_logs
    traces_table_name: signoz_index_v2
    metrics_table_name: signoz_metrics

  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: signoz
    const_labels:
      cluster: finance-manager
      environment: ${ENVIRONMENT}

  logging:
    loglevel: info

service:
  pipelines:
    traces:
      receivers: [otlp, jaeger, zipkin]
      processors: [memory_limiter, resource, attributes, batch]
      exporters: [clickhouse]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resource, batch]
      exporters: [clickhouse, prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [clickhouse]

  extensions: [health_check, pprof, zpages]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
